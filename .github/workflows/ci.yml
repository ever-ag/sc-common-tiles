name: Tiles

on: [push, pull_request]

permissions:
  contents: read
  packages: read  # dependencies from GitHub Packages (ever-ag/all) need an authenticated read

env:
  MAVEN_USER: ${{ github.actor }}
  MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github # repository id used for GitHub Packages in the poms
          server-username: MAVEN_USER
          server-password: MAVEN_TOKEN
          cache: maven
      - name: Run the Maven verify phase
#        run: mvn --batch-mode --update-snapshots test-compile
        run: mvn --batch-mode --update-snapshots -DargLine="--add-opens=java.base/java.lang=ALL-UNNAMED" verify
