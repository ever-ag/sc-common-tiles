name: Publish

# Deploys every module to GitHub Packages (ever-ag/sc-common-tiles) when trunk
# changes and the project version in pom.xml hasn't been published yet.
# To release, bump the version in every pom (mvn versions:set -DnewVersion=X.Y.Z
# -DgenerateBackupPoms=false) in the PR. Merges that don't bump it (e.g. Dependabot
# updates) are skipped instead of failing on a duplicate version.
#
# The tiles-request version this build uses (tiles.request.version) must already be
# published from ever-ag/sc-common-tiles-request.

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write  # tag + GitHub release
  packages: write  # deploy to GitHub Packages

env:
  MAVEN_USER: ${{ github.actor }}
  MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          server-username: MAVEN_USER
          server-password: MAVEN_TOKEN
          cache: 'maven'

      - name: Read versions
        run: |
          echo "VERSION=$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "REQUEST_VERSION=$(mvn -B -q -N help:evaluate -Dexpression=tiles.request.version -DforceStdout)" >> "$GITHUB_ENV"

      - name: Check whether this version is already published
        id: check
        run: |
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::notice::$VERSION is a snapshot; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="https://maven.pkg.github.com/${GITHUB_REPOSITORY}/org/apache/tiles/tiles-parent/${VERSION}/tiles-parent-${VERSION}.pom"
          status=$(curl -s -o /dev/null -w '%{http_code}' -u "${MAVEN_USER}:${MAVEN_TOKEN}" "$url")
          case "$status" in
            200|302)
              echo "::notice::tiles $VERSION is already published; skipping. Bump the version to release."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unexpected HTTP $status while checking $url"
              exit 1 ;;
          esac

      - name: Check that tiles-request ${{ env.REQUEST_VERSION }} is published
        if: steps.check.outputs.publish == 'true'
        run: |
          url="https://maven.pkg.github.com/ever-ag/sc-common-tiles-request/org/apache/tiles/tiles-request/${REQUEST_VERSION}/tiles-request-${REQUEST_VERSION}.pom"
          status=$(curl -s -o /dev/null -w '%{http_code}' -u "${MAVEN_USER}:${MAVEN_TOKEN}" "$url")
          if [[ "$status" != "200" && "$status" != "302" ]]; then
            echo "::error::tiles-request $REQUEST_VERSION is not published (HTTP $status). Publish it from ever-ag/sc-common-tiles-request first, then re-run this workflow."
            exit 1
          fi

      # Runs the tiles-core tests (incl. the CVE-2023-49735 regression tests) as part of the deploy;
      # the parent pom still excludes tests in the other modules.
      - name: Build, test and deploy to GitHub Packages
        if: steps.check.outputs.publish == 'true'
        run: mvn -B -DargLine="--add-opens=java.base/java.lang=ALL-UNNAMED" deploy

      - name: Tag release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
